
name: Build Zyxel LTE3302 Firmware

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'OpenWrt source branch, tag or commit'
        required: true
        default: 'feature/zyxel_lte3302-main'
        type: string
      include_luci:
        description: 'Include LuCI web interface'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache
          sudo docker image prune -af
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev libelf-dev \
            python3 python3-setuptools python3-pyelftools \
            rsync unzip zlib1g-dev file wget curl \
            swig ccache subversion time liburiparser-dev \
            xsltproc

      - name: Checkout OpenWrt source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record source revision
        id: source
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" \
            >> "$GITHUB_OUTPUT"

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure firmware
        env:
          INCLUDE_LUCI: ${{ inputs.include_luci }}
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7620=y
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_TARGET_DEVICE_ramips_mt7620_DEVICE_zyxel_lte3302=y
          CONFIG_TARGET_DEVICE_ramips_mt7620_DEVICE_zyxel_lte3302-dt=y
          CONFIG_TARGET_PER_DEVICE_ROOTFS=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          EOF

          if [ "$INCLUDE_LUCI" = "true" ]; then
            echo "CONFIG_PACKAGE_luci=y" >> .config
          fi

          make defconfig

          grep -Fx \
            'CONFIG_TARGET_DEVICE_ramips_mt7620_DEVICE_zyxel_lte3302=y' \
            .config

          grep -Fx \
            'CONFIG_TARGET_DEVICE_ramips_mt7620_DEVICE_zyxel_lte3302-dt=y' \
            .config

          ./scripts/diffconfig.sh

      - name: Download sources
        run: |
          make download -j8
          df -h

      - name: Build firmware
        run: |
          make -j"$(nproc)" || make -j1 V=s

      - name: Prepare release assets
        run: |
          mkdir -p release

          TARGET_DIR=bin/targets/ramips/mt7620

          for device in zyxel_lte3302 zyxel_lte3302-dt; do
            for image in factory sysupgrade; do
              files=("$TARGET_DIR"/*-"$device"-squashfs-"$image".bin)
              if [ ! -s "${files[0]}" ]; then
                echo "::error::Missing image: $device $image"
                exit 1
              fi
              cp "${files[@]}" release/
            done
          done

          cp "$TARGET_DIR"/*.manifest release/
          cp "$TARGET_DIR/profiles.json" release/
          cp .config release/build.config
          ./scripts/diffconfig.sh > release/config.seed

          git rev-parse HEAD > release/source-commit.txt

          for feed in feeds/*; do
            if [ -d "$feed/.git" ]; then
              echo "$(basename "$feed") $(git -C "$feed" rev-parse HEAD)"
            fi
          done > release/feed-commits.txt

          (
            cd release
            sha256sum *.bin > sha256sums
          )

          ls -lh release/

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zyxel-lte3302-firmware
          path: release/
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SHORT_SHA: ${{ steps.source.outputs.short_sha }}
          SOURCE_REF: ${{ inputs.source_ref }}
          INCLUDE_LUCI: ${{ inputs.include_luci }}
        run: |
          TAG="lte3302-$(date -u +%Y%m%d)-${SHORT_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          cat > release-notes.md <<EOF
          Automated OpenWrt test firmware build.

          ## Supported devices
          - Zyxel LTE3302-M432
          - Zyxel LTE3302-M432 Deutsche Telekom variant

          ## Build information
          - Source ref: ${SOURCE_REF}
          - Source commit: ${SOURCE_SHA}
          - Target: ramips/mt7620
          - LuCI included: ${INCLUDE_LUCI}

          ## Firmware images
          Factory and sysupgrade images for both device variants.

          Use only the firmware image matching your hardware.
          Follow the device-specific installation instructions.
          Verify the firmware against the supplied SHA256 checksums.

          This is unofficial experimental firmware.
          EOF

          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "Zyxel LTE3302 - $(date -u +%Y-%m-%d) (${SHORT_SHA})" \
            --notes-file release-notes.md \
            --prerelease

          echo "### Firmware release" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" \
            >> "$GITHUB_STEP_SUMMARY"
